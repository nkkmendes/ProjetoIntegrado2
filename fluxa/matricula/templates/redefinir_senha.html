{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Fluxa - Nova senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="{% static 'login.css' %}" rel="stylesheet" type="text/css" />
</head>
<body>
    <div>
        <div style="border: none; padding-left: 0px; padding-right: 0px; width: 350px; height: 180px; flex-direction: row; align-items: center;">
            <h1>Nova senha</h1>
            <img src="{% static 'Logo.jpeg' %}">
        </div>

        {% if validlink %}
        <form method="post">
            {% csrf_token %}
            <h4>Nova senha</h4>
            {{ form.new_password1 }}
            {{ form.new_password1.errors }}

            <h4>Confirmar nova senha</h4>
            {{ form.new_password2 }}
            {{ form.new_password2.errors }}

            <button type="submit" style="background-color: #1D4E78; color: #FFFFFF; border: 1px solid #1D4E78;">Salvar senha</button>
        </form>
        {% else %}
        <p class="link-extra">Este link é inválido ou expirou.</p>
        <a href="{% url 'recuperar_senha' %}"><button type="button">Pedir novo link</button></a>
        {% endif %}
    </div>
</body>
</html>
